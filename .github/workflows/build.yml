name: build

# 日常 CI：每次 push / PR 都在 Linux 和 Windows 上各编一遍，
# 保证代码在两个平台上都"编得过"（这是跨平台项目最基本的保障）。
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - os: windows-latest
            configure: -A x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 本项目要求 Qt6 >= 6.5，且要用到串口模块（ubuntu 自带的 6.4 不够）
      - name: 安装 Qt（含 QtSerialPort）
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          modules: 'qtserialport'
          cache: true

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev

      - name: 配置
        run: cmake -B build -S . ${{ matrix.configure }}

      - name: 编译
        run: cmake --build build --config Release --parallel
